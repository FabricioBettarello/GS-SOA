services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alaga
      POSTGRES_PASSWORD: alaga
      POSTGRES_DB: alagaalerta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alaga -d alagaalerta"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://alaga:alaga@db:5432/alagaalerta?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
